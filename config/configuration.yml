---
###############################################################
#                   Authelia configuration                    #
###############################################################

# Miscellaneous https://www.authelia.com/configuration/miscellaneous/introduction/
theme: auto

# Logs https://www.authelia.com/configuration/miscellaneous/logging/
log:
  level: 'info'

# First Factor https://www.authelia.com/configuration/first-factor/file/
authentication_backend:
  file:
    path: '/config/users_database.yml'

# Second Factor https://www.authelia.com/configuration/second-factor/introduction/
totp:
  issuer: 'example.com'

# Security https://www.authelia.com/configuration/security/access-control/
access_control:
  default_policy: 'deny'
  rules:
    - domain: '*.example.com'
      policy: 'two_factor'

# Session https://www.authelia.com/configuration/session/introduction/
session:
  cookies:
  - domain: 'example.com'
    authelia_url: 'https://authelia.example.com'

  redis:
    host: 'redis'
    port: 6379

# Storage https://www.authelia.com/configuration/storage/postgres/
storage:
  postgres:
    address: 'tcp://postgres:5432'
    database: 'autheliadb'
    username: 'autheliadbuser'

# Notifier https://www.authelia.com/configuration/notifications/introduction/
# The filesystem notifier works out of the box: password-reset and identity
# verification links land in /config/notification.txt instead of email.
# For production mail delivery, remove the filesystem block, enable the
# SMTP notifier below, and re-add AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE to
# the authelia service environment in the compose file.
notifier:
  filesystem:
    filename: '/config/notification.txt'
#  smtp:
#    address: 'smtp://smtp.example.com:587'
#    username: 'authelia@example.com'
#    sender: "Authelia <authelia@example.com>"
#    subject: "[Authelia] {title}"
