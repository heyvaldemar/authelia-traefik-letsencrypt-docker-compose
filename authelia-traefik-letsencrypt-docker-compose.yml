# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:3.7@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf}
  postgres: &postgres-image ${AUTHELIA_POSTGRES_IMAGE_TAG:-postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94}
  redis: &redis-image ${AUTHELIA_REDIS_IMAGE_TAG:-redis:7.4@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7}
  authelia: &authelia-image ${AUTHELIA_IMAGE_TAG:-authelia/authelia:4.39.20@sha256:1b363e9279e742397966333f364e0876ae02bf5c876de73e83af6d48c57ff51b}

networks:
  authelia-network:
    external: true
  traefik-network:
    external: true

volumes:
  redis-data:
  authelia-postgres:
  authelia-postgres-backup:
  authelia-database-backups:
  traefik-certificates:

services:
  postgres:
    image: *postgres-image
    # Resource limits as .env-overridable defaults (e.g. AUTHELIA_POSTGRES_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${AUTHELIA_POSTGRES_MEMORY_LIMIT:-1g}
          cpus: "${AUTHELIA_POSTGRES_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${AUTHELIA_POSTGRES_MEMORY_RESERVATION:-128m}
          cpus: "${AUTHELIA_POSTGRES_CPU_RESERVATION:-0.25}"
    volumes:
      - authelia-postgres:/var/lib/postgresql/data
      - ./config/secrets/STORAGE_PASSWORD:/run/secrets/storage_password
    environment:
      POSTGRES_DB: ${AUTHELIA_DB_NAME:-autheliadb}
      POSTGRES_USER: ${AUTHELIA_DB_USER:-autheliadbuser}
      POSTGRES_PASSWORD_FILE: /run/secrets/storage_password
    networks:
      - authelia-network
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${AUTHELIA_DB_NAME:-autheliadb}", "-U", "${AUTHELIA_DB_USER:-autheliadbuser}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  redis:
    image: *redis-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # Resource limits as .env-overridable defaults (e.g. AUTHELIA_REDIS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${AUTHELIA_REDIS_MEMORY_LIMIT:-256m}
          cpus: "${AUTHELIA_REDIS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${AUTHELIA_REDIS_MEMORY_RESERVATION:-32m}
          cpus: "${AUTHELIA_REDIS_CPU_RESERVATION:-0.1}"
    # Official redis image (the bitnami one is frozen since Broadcom's 2025
    # catalog change). No *_FILE env support here, so the entrypoint shell
    # reads the mounted secret itself.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\""]
    volumes:
      - redis-data:/data
      - ./config/secrets/REDIS_PASSWORD:/run/secrets/redis_password:ro
    networks:
      - authelia-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  authelia:
    image: *authelia-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. AUTHELIA_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${AUTHELIA_MEMORY_LIMIT:-512m}
          cpus: "${AUTHELIA_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${AUTHELIA_MEMORY_RESERVATION:-64m}
          cpus: "${AUTHELIA_CPU_RESERVATION:-0.25}"
    volumes:
      - ./config:/config
    environment:
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /config/secrets/JWT_SECRET
      AUTHELIA_SESSION_SECRET_FILE: /config/secrets/SESSION_SECRET
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/STORAGE_ENCRYPTION_KEY
      AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE: /config/secrets/STORAGE_PASSWORD
      AUTHELIA_SESSION_REDIS_PASSWORD_FILE: /config/secrets/REDIS_PASSWORD
      TZ: ${AUTHELIA_TIMEZONE:-America/New_York}
    networks:
      - authelia-network
      - traefik-network
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.authelia.rule=Host(`${AUTHELIA_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.authelia.service=authelia"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.authelia.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"
      # Enable TLS on this router
      - "traefik.http.routers.authelia.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.authelia.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.authelia.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.authelia.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Integrate forward authentication using Authelia
      - "traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/verify?rd=https://${AUTHELIA_HOSTNAME}"
      # Trust the Forwarded headers from previous proxies
      - "traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true"
      # Specify headers to forward with authenticated responses
      - "traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      traefik:
        condition: service_healthy

  traefik:
    image: *traefik-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits as .env-overridable defaults (e.g. TRAEFIK_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    image: *postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Resource limits as .env-overridable defaults (e.g. AUTHELIA_BACKUPS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${AUTHELIA_BACKUPS_MEMORY_LIMIT:-256m}
          cpus: "${AUTHELIA_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${AUTHELIA_BACKUPS_MEMORY_RESERVATION:-32m}
          cpus: "${AUTHELIA_BACKUPS_CPU_RESERVATION:-0.1}"
    # The database password is read from the same secret file PostgreSQL
    # uses, so nothing about the backups lives in .env.
    command: >-
      bash -c 'set -o pipefail;
      export PGPASSWORD="$$(cat /run/secrets/storage_password)";
      sleep "$$AUTHELIA_BACKUP_INIT_SLEEP";
      while true; do
        STAMP="$$(date +%Y-%m-%d_%H-%M)";
        DB_FILE="$$AUTHELIA_POSTGRES_BACKUPS_PATH/$$AUTHELIA_POSTGRES_BACKUP_NAME-$$STAMP.gz";
        echo "[$$(date -Iseconds)] Starting database backup to $$DB_FILE";
        if pg_dump -h postgres -p 5432 -d "$$AUTHELIA_DB_NAME" -U "$$AUTHELIA_DB_USER" | gzip > "$$DB_FILE"; then
          echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE ($$(stat -c %s "$$DB_FILE") bytes)";
        else
          echo "[$$(date -Iseconds)] Database backup FAILED - partial file kept as $$DB_FILE.failed for diagnosis" >&2;
          mv "$$DB_FILE" "$$DB_FILE.failed" 2>/dev/null || true;
        fi;
        if [ "$${AUTHELIA_POSTGRES_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$AUTHELIA_POSTGRES_BACKUPS_PATH" -type f -name "$$AUTHELIA_POSTGRES_BACKUP_NAME-*" -mtime "+$$AUTHELIA_POSTGRES_BACKUP_PRUNE_DAYS" -delete;
        fi;
        sleep "$$AUTHELIA_BACKUP_INTERVAL";
      done'
    volumes:
      - authelia-postgres-backup:/var/lib/postgresql/data
      - authelia-database-backups:${AUTHELIA_POSTGRES_BACKUPS_PATH:-/srv/authelia-postgres/backups}
      - ./config/secrets/STORAGE_PASSWORD:/run/secrets/storage_password:ro
    environment:
      AUTHELIA_DB_NAME: ${AUTHELIA_DB_NAME:-autheliadb}
      AUTHELIA_DB_USER: ${AUTHELIA_DB_USER:-autheliadbuser}
      AUTHELIA_BACKUP_INIT_SLEEP: ${AUTHELIA_BACKUP_INIT_SLEEP:-30m}
      AUTHELIA_BACKUP_INTERVAL: ${AUTHELIA_BACKUP_INTERVAL:-24h}
      AUTHELIA_POSTGRES_BACKUP_PRUNE_DAYS: ${AUTHELIA_POSTGRES_BACKUP_PRUNE_DAYS:-7}
      AUTHELIA_POSTGRES_BACKUPS_PATH: ${AUTHELIA_POSTGRES_BACKUPS_PATH:-/srv/authelia-postgres/backups}
      AUTHELIA_POSTGRES_BACKUP_NAME: ${AUTHELIA_POSTGRES_BACKUP_NAME:-authelia-postgres-backup}
    networks:
      - authelia-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
